<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منظّم حياتي</title>
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#4A90D9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="منظم حياتي">
  <meta name="description" content="منظّم حياتي - إدارة المهام والصلاة والتقويم والتمارين">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #4A90D9 0%, #357ABD 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
    }
    .container {
      padding: 40px;
      max-width: 400px;
    }
    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 20px;
      border-radius: 30px;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      font-weight: bold;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.2);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
    }
    p {
      font-size: 16px;
      opacity: 0.9;
      margin-bottom: 30px;
      line-height: 1.6;
    }
    .open-btn {
      display: inline-block;
      padding: 16px 40px;
      background: white;
      color: #4A90D9;
      text-decoration: none;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .open-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
    }
    .features {
      margin-top: 40px;
      text-align: right;
    }
    .features h3 {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 15px;
    }
    .feature-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }
    .feature-tag {
      padding: 6px 12px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 12px;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">مظ</div>
    <h1>منظّم حياتي</h1>
    <p>تطبيق شامل لإدارة مهامك وصلواتك وأذكارك وتمارينك الرياضية</p>
    
    <a href="https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec" class="open-btn">
      افتح التطبيق
    </a>
    
    <div class="features">
      <h3>المميزات</h3>
      <div class="feature-list">
        <span class="feature-tag">tasks</span>
        <span class="feature-tag">salat</span>
        <span class="feature-tag">adhkar</span>
        <span class="feature-tag">workout</span>
        <span class="feature-tag">quran</span>
        <span class="feature-tag">calendar</span>
      </div>
    </div>
  </div>

  <script>
    // Service Worker Registration
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
        .then(function(registration) {
          console.log('SW registered:', registration.scope);
        })
        .catch(function(error) {
          console.log('SW registration failed:', error);
        });
    }
    
    // Auto-redirect if opened from home screen
    if (window.matchMedia('(display-mode: standalone)').matches) {
      window.location.href = 'https://script.google.com/macros/s/YOUR_SCRIPT_ID/exec';
    }
  </script>
</body>
</html>
